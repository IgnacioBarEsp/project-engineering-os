<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Project Engineering OS — Variante B, Cuaderno de ingeniería</title>
  <desc id="desc">Composición editorial con una hoja crema para el flujo SDD, una columna verde de evidencia real y anotaciones del motor de deuda.</desc>
  <rect width="1600" height="1000" fill="#080C09"/>
  <rect x="54" y="48" width="960" height="904" fill="#F2E8D5"/>
  <rect x="1014" y="48" width="532" height="904" fill="#153B2A"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="94" y="100" fill="#153B2A" font-size="12" font-weight="700" letter-spacing="3">PROJECT ENGINEERING OS</text>
    <text x="970" y="100" text-anchor="end" fill="#476856" font-size="11" letter-spacing="2">NOTA DE CAMPO / 01</text>
    <path d="M94 122H970" stroke="#BDB4A3"/>

    <text x="94" y="222" fill="#153B2A" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="66">La verdadera ingeniería</text>
    <text x="94" y="292" fill="#153B2A" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="66">empieza antes del código.</text>
    <text x="98" y="338" fill="#4D5D50" font-size="16">Una forma guiada de convertir intención en evidencia.</text>

    <text x="94" y="406" fill="#526357" font-size="10" font-weight="700" letter-spacing="2.2">EL RECORRIDO, SIN ATAJOS</text>
    <path d="M128 448V808" stroke="#153B2A" stroke-width="2"/>

    <g>
      <circle cx="128" cy="466" r="18" fill="#153B2A"/>
      <text x="128" y="471" text-anchor="middle" fill="#F2E8D5" font-size="11" font-weight="800">01</text>
      <text x="174" y="462" fill="#153B2A" font-size="18" font-weight="750">Issue y contexto</text>
      <text x="174" y="488" fill="#526357" font-size="13">El problema queda observable antes de proponer.</text>
      <text x="760" y="472" fill="#6F6457" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="15">intención</text>
    </g>
    <g>
      <circle cx="128" cy="546" r="18" fill="#F2E8D5" stroke="#153B2A" stroke-width="2"/>
      <text x="128" y="551" text-anchor="middle" fill="#153B2A" font-size="11" font-weight="800">02</text>
      <text x="174" y="542" fill="#153B2A" font-size="18" font-weight="750">Spec y diseño</text>
      <text x="174" y="568" fill="#526357" font-size="13">Lo que debe ocurrir se vuelve un contrato verificable.</text>
      <text x="760" y="552" fill="#6F6457" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="15">decisión</text>
    </g>
    <g>
      <circle cx="128" cy="626" r="18" fill="#F2E8D5" stroke="#153B2A" stroke-width="2"/>
      <text x="128" y="631" text-anchor="middle" fill="#153B2A" font-size="11" font-weight="800">03</text>
      <text x="174" y="622" fill="#153B2A" font-size="18" font-weight="750">Apply</text>
      <text x="174" y="648" fill="#526357" font-size="13">El código avanza en tareas pequeñas con alcance.</text>
      <text x="760" y="632" fill="#6F6457" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="15">trabajo</text>
    </g>
    <g>
      <circle cx="128" cy="706" r="18" fill="#F2E8D5" stroke="#153B2A" stroke-width="2"/>
      <text x="128" y="711" text-anchor="middle" fill="#153B2A" font-size="11" font-weight="800">04</text>
      <text x="174" y="702" fill="#153B2A" font-size="18" font-weight="750">QA y revisión adversarial</text>
      <text x="174" y="728" fill="#526357" font-size="13">La evidencia intenta refutar el resultado, no decorarlo.</text>
      <text x="760" y="712" fill="#6F6457" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="15">prueba</text>
    </g>
    <g>
      <circle cx="128" cy="786" r="18" fill="#9CC7AB" stroke="#153B2A" stroke-width="2"/>
      <text x="128" y="791" text-anchor="middle" fill="#153B2A" font-size="11" font-weight="800">05</text>
      <text x="174" y="782" fill="#153B2A" font-size="18" font-weight="750">Deuda, archive y PR</text>
      <text x="174" y="808" fill="#526357" font-size="13">Lo pendiente se clasifica; el cierre deja recuperación.</text>
      <text x="760" y="792" fill="#6F6457" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="15">memoria</text>
    </g>

    <path d="M94 860H970" stroke="#BDB4A3"/>
    <text x="94" y="897" fill="#153B2A" font-size="10" font-weight="700" letter-spacing="2">FACILIDAD · PROFESIONALIDAD · VERSATILIDAD</text>
    <text x="970" y="897" text-anchor="end" fill="#526357" font-size="11">MIT / v0.1.6</text>

    <text x="1058" y="101" fill="#9CC7AB" font-size="11" font-weight="700" letter-spacing="2.2">PRUEBA DE CAMPO</text>
    <text x="1502" y="101" text-anchor="end" fill="#83AA91" font-size="10" letter-spacing="1.5">WINDOWS · EXIT 0</text>
    <path d="M1058 122H1502" stroke="#47745B"/>

    <g font-family="Consolas, Courier New, monospace">
      <text x="1058" y="174" fill="#F2E8D5" font-size="13">&gt; npx --yes</text>
      <text x="1078" y="202" fill="#F2E8D5" font-size="13">create-project-engineering-os@0.1.6</text>
      <text x="1078" y="230" fill="#F2E8D5" font-size="13">bootstrap --target .</text>
      <text x="1058" y="286" fill="#9CC7AB" font-size="15">[APPLIED] bootstrap</text>
      <text x="1058" y="318" fill="#83AA91" font-size="12">Modo: apply</text>
      <text x="1058" y="346" fill="#83AA91" font-size="12">Mutación: sí</text>
      <text x="1058" y="374" fill="#F2E8D5" font-size="12">create=74 · conflict=0</text>
      <text x="1058" y="402" fill="#F2E8D5" font-size="12">state=update</text>
    </g>

    <text x="1058" y="486" fill="#9CC7AB" font-size="11" font-weight="700" letter-spacing="2.2">MOTOR DE DEUDA</text>
    <path d="M1058 505H1502" stroke="#47745B"/>
    <text x="1058" y="560" fill="#F2E8D5" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="32">No todo warning</text>
    <text x="1058" y="600" fill="#F2E8D5" font-family="Georgia, Times New Roman, serif" font-style="italic" font-size="32">es una deuda.</text>
    <text x="1058" y="646" fill="#93B49E" font-size="13">verificar</text>
    <path d="M1138 641H1202" stroke="#6F9C81" stroke-width="2"/>
    <text x="1220" y="646" fill="#93B49E" font-size="13">clasificar</text>
    <path d="M1303 641H1367" stroke="#6F9C81" stroke-width="2"/>
    <text x="1384" y="646" fill="#93B49E" font-size="13">gobernar</text>

    <rect x="1058" y="700" width="444" height="92" fill="#0E2C1E" stroke="#47745B"/>
    <text x="1082" y="733" fill="#9CC7AB" font-size="10" font-weight="700" letter-spacing="1.5">SEÑALES QUE PAUSAN</text>
    <text x="1082" y="763" fill="#F2E8D5" font-size="13">Blockers · recurrencia · presupuesto · excepción vencida</text>

    <text x="1058" y="856" fill="#9CC7AB" font-size="10" font-weight="700" letter-spacing="1.8">NÚCLEO UNIVERSAL</text>
    <text x="1058" y="884" fill="#D6D5C5" font-size="12">5 agentes · readiness · rollback · CI</text>
    <text x="1058" y="912" fill="#83AA91" font-size="12">sin elegir tu framework ni tu producto</text>
  </g>
</svg>
