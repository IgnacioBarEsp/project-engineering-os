name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  matrix:
    name: CI / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20.20.0, 22.22.0]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Use reviewed npm
        run: npm install --global --ignore-scripts npm@11.19.1
      - name: Install
        run: npm ci --ignore-scripts
      - name: Validate
        run: npm run check
      - name: Tarball fixture
        run: npm run fixture

  dependency-audit:
    name: CI / dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            blueprint/core/package-lock.json
      - name: Use reviewed npm
        run: npm install --global --ignore-scripts npm@11.19.1
      - name: Reject high or critical dependency risk
        run: npm run check:audit
      - name: Verify quarantine and scoped exception
        run: npm run check:install-policy

  required:
    name: CI / required
    if: ${{ always() }}
    needs: [matrix, dependency-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Reject absent, failed, cancelled or skipped matrix
        env:
          MATRIX_RESULT: ${{ needs.matrix.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
        run: |
          test "$MATRIX_RESULT" = "success" || {
            echo "Required matrix result is $MATRIX_RESULT"
            exit 1
          }
          test "$AUDIT_RESULT" = "success" || {
            echo "Dependency audit result is $AUDIT_RESULT"
            exit 1
          }
