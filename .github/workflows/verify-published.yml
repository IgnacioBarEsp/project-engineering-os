name: Verify published release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published SemVer tag, for example v0.3.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Release / verify published artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - name: Use reviewed npm
        run: npm install --global --ignore-scripts npm@11.19.1
      - name: Verify existing tag and signed artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/verify-published.mjs --tag "$RELEASE_TAG"
